name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  obscurity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/obscurity
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        env:
          MW_API_KEY: ${{ secrets.MW_API_KEY }}
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "MW_API_KEY=${MW_API_KEY}"
          } > .env

      - name: Start the stack 
        run: docker compose up -d --build --wait

      - name: Obscurity scores a word
        run: |
          docker compose exec -T app wget -qO- http://obscurity:8080/score/hello \
            | tee /dev/stderr | grep -qE '"score": *[0-9]'

      - name: Obscurity defines a word over HTTPS
        run: |
          docker compose exec -T app wget -qO- http://obscurity:8080/define/hello \
            | tee /dev/stderr | grep -qE '"entries": *\[ *\{'

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
